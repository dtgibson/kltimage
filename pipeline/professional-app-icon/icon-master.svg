<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">KLT Image — registered color</title>
  <desc id="desc">A cool white rounded tile containing a navy and teal image, with a pale diagonal shared across both halves.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF3F4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0.2" y2="1">
      <stop stop-color="#007F92"/><stop offset="1" stop-color="#006C7D"/>
    </linearGradient>
    <clipPath id="image"><rect x="224" y="248" width="576" height="528" rx="80"/></clipPath>
  </defs>
  <rect x="64" y="72" width="896" height="896" rx="200" fill="#193A4A" opacity="0.1"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.8"/>
  <g clip-path="url(#image)">
    <rect x="224" y="248" width="288" height="528" fill="#193A4A"/>
    <rect x="512" y="248" width="288" height="528" fill="url(#teal)"/>
    <path d="M224 656 800 328V480L224 808Z" fill="#D9F0F3"/>
    <path d="M512 492 800 328V480L512 644Z" fill="#FFFFFF"/>
    <path d="M512 248V776" stroke="#F7F9F9" stroke-width="24"/>
  </g>
</svg>
