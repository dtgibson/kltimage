name: KLTImage

options:
  bundleIdPrefix: com.kltimage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  ReleaseTests: release

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CLANG_ENABLE_MODULES: YES
  configs:
    ReleaseTests:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      ARCHS: arm64

targets:
  KLTCore:
    type: framework
    platform: macOS
    sources:
      - path: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"

  KLTImage:
    type: application
    platform: macOS
    sources:
      - path: KLTImage
        excludes:
          - Resources
      - path: KLTImage/Resources
        buildPhase: resources
    dependencies:
      - target: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.mac
        PRODUCT_NAME: KLT Image
        PRODUCT_MODULE_NAME: KLTImage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.3.2
        CURRENT_PROJECT_VERSION: 8
        VERSIONING_SYSTEM: apple-generic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KLT Image
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        CODE_SIGN_ENTITLEMENTS: KLTImage/KLTImage.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        ReleaseTests:
          # Local Release UI tests use ad-hoc signatures for both the app and
          # KLTCore. Hardened library validation rejects that unsigned-team
          # pairing before XCTest can launch. The release script still signs
          # both bundles with Developer ID and --options runtime.
          ENABLE_HARDENED_RUNTIME: NO
          # Keep UI-test environment overrides available in this optimized
          # test-only build without including them in the shipping Release.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

  KLTCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KLTCoreTests
    dependencies:
      - target: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.core-tests
        GENERATE_INFOPLIST_FILE: YES

  KLTImageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KLTImageTests
    dependencies:
      - target: KLTImage
      - target: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.app-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KLT Image.app/Contents/MacOS/KLT Image"
        BUNDLE_LOADER: "$(TEST_HOST)"

  KLTImageUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KLTImageUITests
    dependencies:
      - target: KLTImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.ui-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KLTImage:
    build:
      targets:
        KLTCore: all
        KLTImage: all
        KLTCoreTests: [test]
    test:
      targets:
        - KLTCoreTests
        - KLTImageTests
        - KLTImageUITests
      gatherCoverageData: true
