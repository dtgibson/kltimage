name: KLTImage

options:
  bundleIdPrefix: com.kltimage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CLANG_ENABLE_MODULES: YES

targets:
  KLTCore:
    type: framework
    platform: macOS
    sources:
      - path: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KLTImage:
    type: application
    platform: macOS
    sources:
      - path: KLTImage
        excludes:
          - Resources
      - path: KLTImage/Resources
        buildPhase: resources
    dependencies:
      - target: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.mac
        PRODUCT_NAME: KLT Image
        PRODUCT_MODULE_NAME: KLTImage
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 3
        VERSIONING_SYSTEM: apple-generic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KLT Image
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        CODE_SIGN_ENTITLEMENTS: KLTImage/KLTImage.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES

  KLTCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KLTCoreTests
    dependencies:
      - target: KLTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.core-tests
        GENERATE_INFOPLIST_FILE: YES

  KLTImageUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KLTImageUITests
    dependencies:
      - target: KLTImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kltimage.ui-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KLTImage:
    build:
      targets:
        KLTCore: all
        KLTImage: all
        KLTCoreTests: [test]
    test:
      targets:
        - KLTCoreTests
        - KLTImageUITests
      gatherCoverageData: true
